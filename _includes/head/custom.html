# Bold and underline active section on Homepage when click it.

<script>
  document.addEventListener("DOMContentLoaded", function() {
    // 1. Lấy đường dẫn URL thực tế hiện tại
    var currentPath = window.location.pathname;

    // 2. Tìm tất cả các liên kết trong menu header
    var navLinks = document.querySelectorAll('.greedy-nav a');

    navLinks.forEach(function(link) {
      var href = link.getAttribute('href');
      if (!href) return;

      // Chuẩn hóa đường dẫn bằng cách xóa bớt các ký tự / thừa ở hai đầu
      var cleanHref = href.replace(/^\/+|\/+$/g, '');
      var cleanPath = currentPath.replace(/^\/+|\/+$/g, '');

      // Tách lấy từ khóa chính của menu (ví dụ: 'blog', 'projects', 'publications', 'cv')
      var hrefSegment = cleanHref.split('/').pop();

      var isActive = false;

      // Kiểm tra trang chủ (Home): Nếu path rỗng hoặc chỉ chứa tên repo
      if (cleanHref === '' || cleanHref === 'uyentran-ai-blog') {
        if (cleanPath === '' || cleanPath === 'uyentran-ai-blog') {
          isActive = true;
        }
      } 
      // Kiểm tra các trang khác: So sánh từ khóa chính trong URL
      else if (hrefSegment && cleanPath.indexOf(hrefSegment) !== -1) {
        isActive = true;
      }

      // Nếu đúng trang hiện tại -> Ép Bold & Underline
      if (isActive) {
        link.style.setProperty('font-weight', 'bold', 'important');
        link.style.setProperty('text-decoration', 'underline', 'important');
        link.style.setProperty('text-underline-offset', '5px', 'important');
      } else {
        // Reset lại nếu không phải trang hiện tại để tránh bị dính highlight nhầm
        link.style.removeProperty('font-weight');
        link.style.removeProperty('text-decoration');
        link.style.removeProperty('text-underline-offset');
      }
    });
  });
</script>
