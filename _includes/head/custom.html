{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#ffffff"/>

<!-- end custom head snippets -->



<script>
  window.addEventListener("load", function() {
    // 1. Lấy đường dẫn thực tế trên trình duyệt
    var path = window.location.pathname.toLowerCase();

    // 2. Tìm tất cả liên kết trong menu
    var navLinks = document.querySelectorAll('.greedy-nav a');

    // 3. Reset lại toàn bộ menu trước
    navLinks.forEach(function(link) {
      link.style.removeProperty('font-weight');
      link.style.removeProperty('text-decoration');
      link.style.removeProperty('text-underline-offset');
    });

    // 4. Tìm đúng mục cần Highlight
    navLinks.forEach(function(link) {
      var href = (link.getAttribute('href') || '').toLowerCase();
      if (!href) return;

      var isMatch = false;

      // Trang chủ (Home) - CHỈ match khi path hoàn toàn là trang chủ
      if (href === '/' || href.endsWith('/uyentran-ai-blog/') || href.endsWith('/uyentran-ai-blog')) {
        if (path === '/' || path.endsWith('/uyentran-ai-blog/') || path.endsWith('/uyentran-ai-blog') || path.endsWith('/index.html')) {
          isMatch = true;
        }
      } 
      // Các mục khác: Bắt chính xác từ khóa trong path
      else if (href.includes('blog') && path.includes('blog')) {
        isMatch = true;
      } else if (href.includes('projects') && path.includes('projects')) {
        isMatch = true;
      } else if (href.includes('publications') && path.includes('publications')) {
        isMatch = true;
      } else if (href.includes('cv') && path.includes('cv')) {
        isMatch = true;
      }

      // 5. Ép hiệu ứng Bold + Underline
      if (isMatch) {
        link.style.setProperty('font-weight', 'bold', 'important');
        link.style.setProperty('text-decoration', 'underline', 'important');
        link.style.setProperty('text-underline-offset', '5px', 'important');
      }
    });
  });
</script>
