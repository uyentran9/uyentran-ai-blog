<style>
  /* 1. Reset thuộc tính cho tất cả thẻ a trong menu */
  .greedy-nav a {
    text-decoration: none !important;
  }

  /* 2. Highlight khi ở trang AI Journey / Blog (Bao gồm cả bài con) */
  body[class*="blog"] .greedy-nav a[href*="blog"],
  body[class*="post"] .greedy-nav a[href*="blog"] {
    font-weight: bold !important;
    text-decoration: underline !important;
    text-underline-offset: 5px !important;
  }

  /* 3. Highlight khi ở trang Projects (Bao gồm cả bài con như hepatic-risk.md) */
  body[class*="project"] .greedy-nav a[href*="projects"],
  body[class*="page"] .greedy-nav a[href*="projects"] {
    font-weight: bold !important;
    text-decoration: underline !important;
    text-underline-offset: 5px !important;
  }

  /* 4. Highlight khi ở trang Publications (Bao gồm cả bài con) */
  body[class*="publication"] .greedy-nav a[href*="publications"] {
    font-weight: bold !important;
    text-decoration: underline !important;
    text-underline-offset: 5px !important;
  }

  /* 5. Highlight khi ở trang CV */
  body[class*="cv"] .greedy-nav a[href*="cv"] {
    font-weight: bold !important;
    text-decoration: underline !important;
    text-underline-offset: 5px !important;
  }

  /* 6. Highlight trang Home (CHỈ khi đứng ở trang chủ duy nhất) */
  body.layout--home .greedy-nav a[href$="uyentran-ai-blog/"],
  body.layout--home .greedy-nav a[href="/"],
  body.layout--splash .greedy-nav a[href$="uyentran-ai-blog/"],
  body.layout--splash .greedy-nav a[href="/"] {
    font-weight: bold !important;
    text-decoration: underline !important;
    text-underline-offset: 5px !important;
  }
</style>
