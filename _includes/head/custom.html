{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#ffffff"/>

<!-- end custom head snippets -->



<script>
  document.addEventListener("DOMContentLoaded", function() {
    var path = window.location.pathname.toLowerCase();
    var navLinks = document.querySelectorAll('.greedy-nav a');

    navLinks.forEach(function(link) {
      var href = (link.getAttribute('href') || '').toLowerCase();
      if (!href) return;

      var isActive = false;

      // 1. Kiểm tra mục Home (Chỉ active khi URL CHÍNH XÁC là trang chủ)
      if (href === '/' || href.endsWith('/uyentran-ai-blog/') || href.endsWith('/uyentran-ai-blog')) {
        // Chỉ chấp nhận khi path thực tế đúng là trang chủ
        if (path === '/' || path.endsWith('/uyentran-ai-blog/') || path.endsWith('/uyentran-ai-blog') || path.endsWith('/index.html')) {
          isActive = true;
        }
      } 
      // 2. AI Journey / Blog
      else if (href.includes('/blog') && path.includes('/blog')) {
        isActive = true;
      }
      // 3. Projects
      else if (href.includes('/projects') && path.includes('/projects')) {
        isActive = true;
      }
      // 4. Publications
      else if (href.includes('/publications') && path.includes('/publications')) {
        isActive = true;
      }
      // 5. CV
      else if (href.includes('/cv') && path.includes('/cv')) {
        isActive = true;
      }

      // Áp dụng CSS trực tiếp hoặc reset lại
      if (isActive) {
        link.style.setProperty('font-weight', 'bold', 'important');
        link.style.setProperty('text-decoration', 'underline', 'important');
        link.style.setProperty('text-underline-offset', '5px', 'important');
      } else {
        link.style.removeProperty('font-weight');
        link.style.removeProperty('text-decoration');
        link.style.removeProperty('text-underline-offset');
      }
    });
  });
</script>
