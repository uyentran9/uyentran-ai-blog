{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><span class="navicon"></span></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg persist"><a href="{{ base_path }}/">{{ site.title }}</a></li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
          <li id="theme-toggle" class="masthead__menu-item persist tail">
            <a role="button" aria-labelledby="theme-icon"><i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true" title="toggle theme"></i></a>
          </li>
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>


<script>
  function highlightActiveMenu() {
    var path = window.location.pathname;
    
    // Xác định từ khóa dựa trên URL thực tế
    var activeKey = "";
    if (path.indexOf("/blog/") !== -1) activeKey = "/blog/";
    else if (path.indexOf("/projects/") !== -1) activeKey = "/projects/";
    else if (path.indexOf("/publications/") !== -1) activeKey = "/publications/";
    else if (path.indexOf("/cv/") !== -1) activeKey = "/cv/";
    else if (path === "/" || path.endsWith("/uyentran-ai-blog/")) activeKey = "home";

    if (!activeKey) return;

    // Chèn CSS trực tiếp vào <head> để gạch chân vĩnh viễn, không lo bị JS của theme ghi đè
    var styleId = "custom-nav-active-style";
    var existingStyle = document.getElementById(styleId);
    if (existingStyle) existingStyle.remove();

    var style = document.createElement('style');
    style.id = styleId;
    
    if (activeKey === "home") {
      style.innerHTML = '.greedy-nav a[href$="/uyentran-ai-blog/"], .greedy-nav a[href="/"] { font-weight: bold !important; text-decoration: underline !important; text-underline-offset: 5px !important; }';
    } else {
      style.innerHTML = '.greedy-nav a[href*="' + activeKey + '"] { font-weight: bold !important; text-decoration: underline !important; text-underline-offset: 5px !important; }';
    }
    
    document.head.appendChild(style);
  }

  // Chạy ngay khi tải trang và khi DOM đã sẵn sàng
  highlightActiveMenu();
  document.addEventListener("DOMContentLoaded", highlightActiveMenu);
  window.addEventListener("load", highlightActiveMenu);
</script>
