{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><span class="navicon"></span></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg persist"><a href="{{ base_path }}/">{{ site.title }}</a></li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
          <li id="theme-toggle" class="masthead__menu-item persist tail">
            <a role="button" aria-labelledby="theme-icon"><i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true" title="toggle theme"></i></a>
          </li>
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>

<script>
  (function() {
    // 1. Lấy đường dẫn hiện tại trên trình duyệt
    var currentPath = window.location.pathname;

    // 2. Tìm tất cả các thẻ <a> trong thanh menu
    var navLinks = document.querySelectorAll('.greedy-nav a');

    navLinks.forEach(function(link) {
      var href = link.getAttribute('href');
      if (!href) return;

      // Chuẩn hóa đường dẫn (loại bỏ domain/subpath trùng)
      var cleanHref = href.replace(/^\/|\/$/g, ''); 
      var cleanPath = currentPath.replace(/^\/|\/$/g, '');

      // Kiểm tra xem bài viết hiện tại có thuộc mục menu này không
      var isHome = (href === '/' || href === '') && (cleanPath === '' || cleanPath.endsWith('uyentran-ai-blog'));
      var isMatch = cleanHref !== '' && cleanPath.indexOf(cleanHref) !== -1;

      if (isHome || isMatch) {
        // Gán style trực tiếp
        link.style.setProperty('font-weight', 'bold', 'important');
        link.style.setProperty('text-decoration', 'underline', 'important');
        link.style.setProperty('text-underline-offset', '5px', 'important');
      }
    });
  })();
</script>
